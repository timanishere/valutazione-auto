<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/base.css')}}">
    <title>{% block title %} {% endblock %}</title>
</head>
<body style="margin: 0px">
    <nav style="background-color: #0f141e; padding: 32px 0">
        <div style="width: 1200px; margin: 0 auto">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <div class="ps-3">
                    <a href="http://127.0.0.1:5000/valutazione-auto">
                        <img src="https://trovaloguidalo.it/wp-content/uploads/2023/07/logo-12.png" alt="TrovaloGuidalo" style="width: 157px">
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    {% block body %} {% endblock %}

    <footer style="background-color: #0f141e; padding: 32px 0">
        <div style="width: 1200px; margin: 0 auto">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <div class="ps-3" style="color: #ffffff">
                    © 2023. TrovaloGuidalo.it
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="text/javascript" src="{{url_for('static', filename='js/scripts.js')}}"></script>
    
</body>
</html>
